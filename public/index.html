<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文字游戏集合</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="hub.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <main class="hub">
      <header class="hub-head">
        <p class="eyebrow">Text Games</p>
        <h1 class="hub-title">文字游戏集合</h1>
        <p class="hub-lead">每个游戏独立目录与路由。选择一个故事开始。</p>
      </header>
      <section id="gameList" class="game-list" aria-label="游戏列表"></section>
      <footer class="hub-foot">
        <span id="hubVersion">v0.9.19</span>
      </footer>
    </main>
    <script src="hub.js"></script>
  </body>
</html>
